[package]
name = "landlock-lint"
version = "0.1.2"
edition = "2021"
description = "Focused prototype: detects recurring misuse patterns in Rust and C uses of Landlock"

[dependencies]
anyhow = "1"
syn = { version = "2", features = ["full", "parsing", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"

[[bin]]
name = "landlock-lint"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
